<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Φόντο: σκούρο στρογγυλεμένο τετράγωνο -->
  <rect width="64" height="64" rx="14" fill="#1b1b26"/>

  <!-- Κορυφή σκηνής / ράγα κουρτίνας -->
  <rect x="8" y="10" width="48" height="5" rx="2" fill="#f5d37a"/>

  <!-- Αριστερή κουρτίνα -->
  <path d="M 10 15
           C 16 22, 12 28, 16 34
           C 12 40, 16 46, 14 52
           C 18 54, 22 53, 24 50
           L 24 15 Z"
        fill="#f5d37a"/>

  <!-- Δεξιά κουρτίνα -->
  <path d="M 54 15
           C 48 22, 52 28, 48 34
           C 52 40, 48 46, 50 52
           C 46 54, 42 53, 40 50
           L 40 15 Z"
        fill="#f5d37a"/>

  <!-- Αστέρι στη σκηνή -->
  <path d="M 32 28
           L 34.5 35
           L 42 35
           L 36 39.5
           L 38.5 46.5
           L 32 42.5
           L 25.5 46.5
           L 28 39.5
           L 22 35
           L 29.5 35 Z"
        fill="#f5d37a"/>
</svg>
